<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Android Architect IDE | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg-deep: #050505;
            --bg-panel: #0a0a0a;
            --accent: #10b981;
            --border: #1a1a1a;
        }

        body { 
            background-color: var(--bg-deep); 
            color: #a1a1aa; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: hidden;
            touch-action: manipulation;
        }

        .code-font { font-family: 'JetBrains Mono', monospace; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation: fadeIn 0.3s ease; }

        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            .mobile-hide { display: none; }
            .mobile-full { width: 100% !important; }
            .text-xs-mobile { font-size: 0.7rem; }
        }

        .hierarchical-line {
            border-left: 1px solid #1a1a1a;
            margin-left: 0.75rem;
            padding-left: 0.75rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "w-4 h-4" }) => {
            useEffect(() => { window.lucide && window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [view, setView] = useState('setup'); 
            const [activeTab, setActiveTab] = useState('editor'); // Para móvil: 'explorer', 'editor', 'console'
            const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth > 768);
            const [isCompiling, setIsCompiling] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [activeFile, setActiveFile] = useState('MainActivity.java');
            const [logs, setLogs] = useState([]);
            
            const [ghData, setGhData] = useState({ token: '', repo: '', prompt: '' });
            const [files, setFiles] = useState({
                'MainActivity.java': '// App Main Entry Point\npublic class MainActivity extends Activity {\n    @Override\n    protected void onCreate(Bundle saved) {\n        super.onCreate(saved);\n    }\n}',
                'GameView.java': '// Game Logic\npublic class GameView extends View {\n    // Drawing logic here\n}',
                'AndroidManifest.xml': '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <application android:label="AI App" />\n</manifest>',
                'build.gradle': 'apply plugin: "com.android.application"\n\nandroid {\n    compileSdkVersion 34\n}'
            });

            const apiKey = ""; 

            // Detectar cambio de tamaño para responsive
            useEffect(() => {
                const handleResize = () => {
                    if (window.innerWidth > 768) setIsSidebarOpen(true);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const addLog = (text, type = 'info') => {
                const colors = { info: 'text-zinc-600', process: 'text-emerald-500', success: 'text-white font-bold', error: 'text-red-500' };
                setLogs(prev => [...prev, { id: Date.now(), text, color: colors[type] }]);
            };

            const startGeneration = async () => {
                if (!ghData.token || !ghData.repo || !ghData.prompt) return;
                setView('ide');
                setIsGenerating(true);
                addLog("Iniciando Kernel...", "process");

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: ghData.prompt }] }],
                            systemInstruction: { parts: [{ text: "Eres un experto en Android Studio. Genera una app completa en un JSON con llaves: MainActivity.java, GameView.java, AndroidManifest.xml, build.gradle." }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const data = await response.json();
                    setFiles(JSON.parse(data.candidates[0].content.parts[0].text));
                    addLog("Proyecto generado exitosamente.", "success");
                } catch (e) {
                    addLog("Fallo en la sincronización IA.", "error");
                } finally {
                    setIsGenerating(false);
                }
            };

            const runCompile = () => {
                setIsCompiling(true);
                setActiveTab('console');
                addLog("Compilando recursos...", "process");
                setTimeout(() => {
                    addLog("Sincronizando con Gradle...", "info");
                    setTimeout(() => {
                        addLog(">>> APK GENERADO EXITOSAMENTE", "success");
                        setIsCompiling(false);
                    }, 2000);
                }, 1500);
            };

            if (view === 'setup') return (
                <div className="h-screen flex items-center justify-center p-6 bg-black">
                    <div className="w-full max-w-lg bg-[#0a0a0a] border border-zinc-900 rounded-[2rem] p-8 shadow-2xl">
                        <div className="flex items-center gap-4 mb-8">
                            <Icon name="smartphone" className="w-8 h-8 text-emerald-500" />
                            <h1 className="text-xl font-black text-white italic uppercase tracking-tighter">Architect <span className="text-emerald-500">IDE</span></h1>
                        </div>
                        <div className="space-y-4">
                            <input type="password" placeholder="GitHub Token" className="w-full bg-black border border-zinc-800 p-4 rounded-xl text-white outline-none focus:border-emerald-500" value={ghData.token} onChange={e => setGhData({...ghData, token: e.target.value})} />
                            <input type="text" placeholder="Repositorio" className="w-full bg-black border border-zinc-800 p-4 rounded-xl text-white outline-none focus:border-emerald-500" value={ghData.repo} onChange={e => setGhData({...ghData, repo: e.target.value})} />
                            <textarea placeholder="Descripción de tu app..." className="w-full bg-black border border-zinc-800 p-4 rounded-xl text-white outline-none focus:border-emerald-500 h-32" value={ghData.prompt} onChange={e => setGhData({...ghData, prompt: e.target.value})} />
                            <button onClick={startGeneration} className="w-full bg-emerald-600 p-4 rounded-xl text-black font-black uppercase tracking-widest text-xs hover:bg-emerald-500 transition-all">Iniciar Proyecto</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="h-screen flex flex-col bg-black overflow-hidden">
                    {/* Header Adaptativo */}
                    <header className="h-14 border-b border-zinc-900 flex items-center justify-between px-4 bg-[#0a0a0a] shrink-0">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 hover:bg-zinc-800 rounded-lg md:hidden">
                                <Icon name="menu" className="w-5 h-5" />
                            </button>
                            <span className="text-[10px] font-black text-white italic uppercase hidden sm:block">Android Professional <span className="text-emerald-500">IDE</span></span>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="hidden md:flex items-center gap-2 px-3 py-1.5 bg-zinc-900/50 rounded-full border border-zinc-800">
                                <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                <span className="text-[8px] font-bold uppercase text-emerald-500">Kernel Activo</span>
                            </div>
                            <button onClick={runCompile} disabled={isCompiling} className="bg-emerald-600 text-black px-4 py-1.5 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 active:scale-95 transition-all">
                                {isCompiling ? <Icon name="loader" className="w-3 h-3 animate-spin" /> : <Icon name="play" className="w-3 h-3 fill-current" />}
                                <span className="hidden xs:inline">Compilar APK</span>
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 flex overflow-hidden relative">
                        {/* Explorador de Archivos (Móvil: Overlay / PC: Sidebar) */}
                        <aside className={`
                            ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} 
                            md:translate-x-0 transition-transform duration-300
                            absolute md:relative z-20 w-64 h-full bg-[#080808] border-r border-zinc-900 flex flex-col
                        `}>
                            <div className="p-4 border-b border-zinc-900 flex justify-between items-center">
                                <span className="text-[10px] font-black text-zinc-500 uppercase tracking-widest">Project Explorer</span>
                                <button onClick={() => setIsSidebarOpen(false)} className="md:hidden">
                                    <Icon name="x" className="w-4 h-4" />
                                </button>
                            </div>
                            <div className="flex-1 overflow-y-auto py-4 px-4 text-[11px]">
                                <div className="flex items-center gap-2 text-white font-bold mb-2 italic">
                                    <Icon name="folder-open" className="w-3 h-3 text-emerald-500" /> AndroidApp_v1
                                </div>
                                <div className="hierarchical-line">
                                    <div className="flex items-center gap-2 text-zinc-400 mb-2">
                                        <Icon name="folder" className="w-3 h-3" /> app
                                    </div>
                                    <div className="hierarchical-line">
                                        <div className="flex items-center gap-2 text-zinc-400 mb-2 font-bold italic">
                                            <Icon name="folder" className="w-3 h-3 text-emerald-500" /> src/main/java
                                        </div>
                                        <div className="hierarchical-line space-y-1">
                                            {Object.keys(files).filter(f => f.endsWith('.java')).map(name => (
                                                <div 
                                                    key={name} 
                                                    onClick={() => { setActiveFile(name); if(window.innerWidth < 768) setIsSidebarOpen(false); }}
                                                    className={`flex items-center gap-2 p-2 rounded-lg cursor-pointer transition-all ${activeFile === name ? 'bg-emerald-500/10 text-emerald-400' : 'text-zinc-500'}`}
                                                >
                                                    <Icon name="file-code" className="w-3 h-3" /> {name}
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex items-center gap-2 text-zinc-500 mt-2 p-2 cursor-pointer" onClick={() => setActiveFile('AndroidManifest.xml')}>
                                            <Icon name="settings" className="w-3 h-3" /> AndroidManifest.xml
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 text-zinc-500 mt-2 p-2 cursor-pointer" onClick={() => setActiveFile('build.gradle')}>
                                        <Icon name="file-text" className="w-3 h-3" /> build.gradle
                                    </div>
                                </div>
                            </div>
                        </aside>

                        {/* Área de Trabajo Principal */}
                        <main className="flex-1 flex flex-col min-w-0 bg-black relative">
                            {/* Selector de modo para Celular */}
                            <div className="md:hidden flex border-b border-zinc-900 bg-[#0a0a0a]">
                                <button onClick={() => setActiveTab('editor')} className={`flex-1 p-3 text-[10px] font-black uppercase ${activeTab === 'editor' ? 'text-emerald-500 border-b-2 border-emerald-500' : 'text-zinc-600'}`}>Editor</button>
                                <button onClick={() => setActiveTab('console')} className={`flex-1 p-3 text-[10px] font-black uppercase ${activeTab === 'console' ? 'text-emerald-500 border-b-2 border-emerald-500' : 'text-zinc-600'}`}>Consola</button>
                            </div>

                            {/* Contenido (Editor) */}
                            <div className={`flex-1 flex flex-col ${activeTab === 'editor' ? 'flex' : 'hidden md:flex'}`}>
                                <div className="h-8 bg-[#080808] border-b border-zinc-900 flex items-center px-4 gap-2 overflow-x-auto whitespace-nowrap scrollbar-hide">
                                    <div className="text-[9px] font-bold text-emerald-500 bg-emerald-500/5 px-3 py-1 rounded-t border-t border-x border-zinc-800">
                                        {activeFile}
                                    </div>
                                </div>
                                <div className="flex-1 relative flex overflow-hidden">
                                    <div className="w-10 bg-[#050505] border-r border-zinc-900 text-[9px] text-zinc-800 text-right pr-2 pt-4 select-none code-font mobile-hide">
                                        {Array.from({length: 40}).map((_, i) => <div key={i}>{i+1}</div>)}
                                    </div>
                                    <textarea 
                                        className="flex-1 bg-transparent p-4 text-zinc-300 font-mono text-xs md:text-sm outline-none resize-none leading-relaxed"
                                        value={files[activeFile]}
                                        onChange={e => setFiles({...files, [activeFile]: e.target.value})}
                                        spellCheck="false"
                                    />
                                    {isGenerating && (
                                        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center gap-4">
                                            <Icon name="cpu" className="w-10 h-10 text-emerald-500 animate-spin" />
                                            <span className="text-[10px] font-black uppercase tracking-[0.4em] animate-pulse">Sincronizando IA</span>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Consola (PC: Abajo / Móvil: Pantalla completa o pestaña) */}
                            <div className={`
                                ${activeTab === 'console' ? 'flex h-full' : 'hidden md:flex md:h-48'} 
                                border-t border-zinc-900 bg-black flex flex-col shrink-0 transition-all
                            `}>
                                <div className="h-8 bg-[#0a0a0a] border-b border-zinc-900 flex items-center px-4 justify-between">
                                    <span className="text-[9px] font-black text-zinc-600 uppercase tracking-widest flex items-center gap-2">
                                        <Icon name="terminal" className="w-3 h-3 text-emerald-500" /> Build Output
                                    </span>
                                    <button className="md:hidden" onClick={() => setActiveTab('editor')}>
                                        <Icon name="maximize-2" className="w-3 h-3" />
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 code-font text-[10px] space-y-1.5 scrollbar-hide bg-black/50">
                                    {logs.length === 0 && <div className="text-zinc-800 italic">// Esperando acciones del sistema...</div>}
                                    {logs.map(log => (
                                        <div key={log.id} className={`${log.color} flex gap-4 fade-in`}>
                                            <span className="opacity-30 text-[8px] whitespace-nowrap">[{new Date(log.id).toLocaleTimeString()}]</span>
                                            <span>{log.text}</span>
                                        </div>
                                    ))}
                                    <div className="h-4"></div>
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Footer Mobile Navigation (Solo visible en pantallas pequeñas) */}
                    <nav className="md:hidden h-14 bg-[#0a0a0a] border-t border-zinc-900 flex items-center justify-around shrink-0">
                        <button onClick={() => setIsSidebarOpen(true)} className="flex flex-col items-center gap-1 text-zinc-500">
                            <Icon name="folder-tree" className="w-4 h-4" />
                            <span className="text-[8px] font-black uppercase">Archivos</span>
                        </button>
                        <button onClick={() => setActiveTab('editor')} className={`flex flex-col items-center gap-1 ${activeTab === 'editor' ? 'text-emerald-500' : 'text-zinc-500'}`}>
                            <Icon name="code" className="w-4 h-4" />
                            <span className="text-[8px] font-black uppercase">Editor</span>
                        </button>
                        <button onClick={() => setActiveTab('console')} className={`flex flex-co
